# Hardened self-hosted production example. App Platform deployments use .do/*.yaml.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcpjungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mcpjungle}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:${MCPJUNGLE_IMAGE_TAG:-latest-stdio}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-mcpjungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mcpjungle}
      SERVER_MODE: enterprise
      DASHBOARD_ENABLED: "true"
      OTEL_ENABLED: "false"
      MCPJUNGLE_PUBLIC_URL: ${MCPJUNGLE_PUBLIC_URL:?set MCPJUNGLE_PUBLIC_URL}
      MCPJUNGLE_ENCRYPTION_KEY: ${MCPJUNGLE_ENCRYPTION_KEY:?set MCPJUNGLE_ENCRYPTION_KEY}
      MCPJUNGLE_BOOTSTRAP_TOKEN: ${MCPJUNGLE_BOOTSTRAP_TOKEN:-}
      MCPJUNGLE_AUTH0_ISSUER: ${MCPJUNGLE_AUTH0_ISSUER:?set MCPJUNGLE_AUTH0_ISSUER}
      MCPJUNGLE_AUTH0_AUDIENCE: ${MCPJUNGLE_AUTH0_AUDIENCE:?set MCPJUNGLE_AUTH0_AUDIENCE}
      MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_ID: ${MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_ID:?set MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_ID}
      MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_SECRET: ${MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_SECRET:?set MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_SECRET}
      MCPJUNGLE_AUTH0_ADMIN_SUBJECT: ${MCPJUNGLE_AUTH0_ADMIN_SUBJECT:?set MCPJUNGLE_AUTH0_ADMIN_SUBJECT}
      MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_ID: ${MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_ID:-}
      MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_SECRET: ${MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_SECRET:-}
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: ${MCP_SERVER_INIT_REQ_TIMEOUT_SEC:-30}
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
