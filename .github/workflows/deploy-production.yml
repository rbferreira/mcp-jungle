name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact staging-tested commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable staging image
        env:
          COMMIT_SHA: ${{ inputs.commit }}
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character SHA" >&2
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "ghcr.io/luckiertrout/mcp-jungle:$COMMIT_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Deploy approved commit
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          MCPJUNGLE_ENCRYPTION_KEY: ${{ secrets.MCPJUNGLE_ENCRYPTION_KEY }}
          MCPJUNGLE_AUTH0_ISSUER: ${{ secrets.MCPJUNGLE_AUTH0_ISSUER }}
          MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_ID: ${{ secrets.MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_ID }}
          MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_SECRET: ${{ secrets.MCPJUNGLE_AUTH0_DASHBOARD_CLIENT_SECRET }}
          MCPJUNGLE_AUTH0_ADMIN_SUBJECT: ${{ secrets.MCPJUNGLE_AUTH0_ADMIN_SUBJECT }}
          MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_ID }}
          MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.MCPJUNGLE_AUTH0_MANAGEMENT_CLIENT_SECRET }}
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          MCPJUNGLE_PRODUCTION_DB_CLUSTER: ${{ vars.MCPJUNGLE_PRODUCTION_DB_CLUSTER }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/production.yaml
          project_id: ${{ vars.DIGITALOCEAN_PROJECT_ID }}
          print_build_logs: "true"
          print_deploy_logs: "true"
      - name: Require initialized readiness
        env:
          LIVE_URL: ${{ fromJson(steps.deploy.outputs.app).live_url }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$LIVE_URL/ready" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment is live but not initialized or ready. Run mcpjungle init-server, then rerun this workflow." >&2
          exit 1
