name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build dashboard
        run: ./scripts/build-dashboard.sh
      - name: Audit dashboard dependencies
        working-directory: web/dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Build production images
        run: |
          docker build --file Dockerfile --tag mcpjungle:http-ci .
          docker build --file stdio.Dockerfile --tag mcpjungle:stdio-ci .
      - name: Scan HTTP container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcpjungle:http-ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: Scan STDIO container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcpjungle:stdio-ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
